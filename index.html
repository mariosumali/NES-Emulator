<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets safe-area insets work on notched phones.
       No user-scalable=no: blocking zoom is a WCAG 1.4.4 failure. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#08090b" />
  <meta name="color-scheme" content="dark light" />

  <title>NES Station — play NES cartridges in your browser</title>
  <meta name="description"
    content="A fast, offline NES emulator that runs entirely in your browser. CRT shaders, rewind, save states with thumbnails, cartridge saves, gamepad and touch support. Your ROMs never leave your device." />

  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NES Station" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="NES Station" />
  <meta property="og:description"
    content="A fast, offline NES emulator for the browser. CRT shaders, rewind, cartridge saves, gamepad and touch support." />
  <meta property="og:image" content="/og.svg" />
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <div id="root"></div>
  <noscript>
    <p style="padding:2rem;font-family:system-ui,sans-serif">
      NES Station is an emulator that runs in your browser, so it needs JavaScript enabled.
    </p>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
